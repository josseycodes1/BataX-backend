components:
  schemas:
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          maxLength: 100
        object_id:
          type: string
          format: uuid
          nullable: true
        details: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - id
    Block:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        blocked_user:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blocked_user
      - created_at
      - id
    BlockRequest:
      type: object
      properties:
        blocked_user:
          type: string
          format: uuid
      required:
      - blocked_user
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        is_prohibited:
          type: boolean
      required:
      - id
      - name
      - slug
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
